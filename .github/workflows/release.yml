name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install JS Dependencies
        working-directory: ./bubblegum
        run: npm install

      - name: Build Tauri App
        working-directory: ./bubblegum
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Strip Versioning from Assets
        working-directory: ./bubblegum/src-tauri/target/release
        run: |
          mkdir -p release_assets
          # Copy and rename built assets to remove versions
          cp bundle/appimage/*.AppImage release_assets/bubblegum.AppImage
          cp bundle/deb/*.deb release_assets/bubblegum.deb
          cp bundle/rpm/*.rpm release_assets/bubblegum.rpm
          # Compress the raw binary
          tar -czvf release_assets/bubblegum.tar.gz bubblegum

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: bubblegum/src-tauri/target/release/release_assets/*
