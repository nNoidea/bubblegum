name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install JS Dependencies
        working-directory: ./bubblegum
        run: npm install

      - name: Build Tauri App
        working-directory: ./bubblegum
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Create raw binary archive
        working-directory: ./bubblegum/src-tauri/target/release
        run: tar -czvf bubblegum-linux-x86_64.tar.gz bubblegum

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bubblegum/src-tauri/target/release/bundle/appimage/*.AppImage
            bubblegum/src-tauri/target/release/bundle/deb/*.deb
            bubblegum/src-tauri/target/release/bundle/rpm/*.rpm
            bubblegum/src-tauri/target/release/bubblegum-linux-x86_64.tar.gz
